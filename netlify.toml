[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# This app is a single-page React app: the server only ever has index.html, and
# React Router resolves the path in the browser. Without this rule, opening
# /admin or /cart directly — or refreshing any page — returns a 404 from
# Netlify. The 200 status rewrites rather than redirects, so the URL is kept.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change contents, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
